name: x86-CI

# Manual-only CI for the private OSx86 repository.
# Both jobs independently check out private OSx86 into the runner workspace.
# `build-wasm` runs the ordinary build and standard test suite.
# `selected-test` runs the selected case from OSx86's .github/run-test.sh.
# The private source is never committed to or uploaded into this public repository.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Select a test to run alongside the build"
        type: choice
        default: none
        options:
          - none
          - framebuffer-present
          - frame-ends-slice
          - display-pixels
          - framebuffer
          - input-event
          - input-queue
          - input-events-read
          - input-events-nonblock
          - input-events-push
          - input-events-musl
          - guest-programs
          - windows-model
          - pe-load
          - windows-hello
          - windows-crt
          - windows-files
          - windows-threads
          - windows-exceptions
          - windows-processes
          - windows-seh
          - windows-cpp-exceptions
          - windows-real-programs
          - browser-load-pe
          - speed-benchmark
          - windows-stress
          - file-path-calls
          - file-paths-musl
          - file-touch-musl
          - directories-musl
          - browser-file-system
          - terminal-exports
          - terminal-musl
          - terminal
          - proc-musl
          - sys-musl
          - musl-dynamic
          - musl-shared-library
          - musl-dlopen
          - musl-dynamic-processes
          - micropython-musl
          - micropython-wasm
          - eventfd-musl
          - pipe-nonblock-musl
          - eventfd-blocking-musl
          - glib-musl
          - gui-renderer
          - gui-window-router
          - gui-renderer-browser
          - gui-app-browser
          - gui-app-click-browser
          - gui-app-font-browser
          - gui-app-cleanup-browser
          - gui-device
          - gtk-shim-skeleton
          - gtk-shim-main-loop
          - gtk-shim-box
          - gtk-shim-packing
          - gtk-shim-sizes
          - gtk-shim-text
          - gtk-shim-containers
          - gtk-shim-grid
          - gtk-shim-login-form
          - gtk-shim-unit-converter
          - gtk-shim-region
          - gtk-shim-pixels
          - gtk-shim-pointer
          - gtk-shim-keys
          - gtk-shim-focus
          - gtk-shim-resend
          - gtk-shim-pad
          - gtk-app-gaps
          - gtk-shim-builder
          - gtk-shim-entry-editing
          - gtk-shim-type-getters
          - gtk-shim-widget-tree
          - gtk-shim-widget-state
          - gtk-shim-widget-tooltip
          - gtk-shim-widget-removal
          - gtk-shim-widget-reorder
          - gtk-shim-widget-activation
          - gtk-shim-widget-geometry
          - gtk-shim-widget-colors
          - gtk-shim-css-radius
          - gtk-shim-widget-platform
          - gtk-shim-dialog-basics
          - gtk-shim-dialog-run
          - gtk-shim-text-buffer-basics
          - gtk-shim-text-buffer-movement
          - gtk-shim-text-buffer-marks
          - gtk-shim-text-buffer-tags
          - gtk-shim-list-store
          - gtk-shim-tree-view
          - gtk-shim-tree-table
          - gtk-shim-tree-sync
          - gtk-shim-tree-selection
          - gtk-shim-tree-scroll
          - gtk-shim-combo-box
          - gtk-shim-combo-box-page
          - gtk-shim-menu
          - gtk-shim-menu-page
          - gtk-shim-builder-menu
          - gtk-shim-window-close
          - gtk-shim-button-press
          - gtk-shim-can-activate-accel
          - gtk-shim-event-box
          - gtk-shim-image
          - gtk-shim-atk-object
          - gtk-shim-accelerator-label
          - gtk-shim-accelerators
          - gtk-shim-clipboard
          - gtk-shim-spin-button
          - gtk-shim-pickers
          - gtk-shim-size-group
          - gtk-app-run
          - galculator-source-fonts
          - wasm-environment
          - gtk-shim-widget-event-dispatch
          - gtk-shim-key-events

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osx86
    steps:
      - name: Checkout private OSx86
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/x86-64
          token: ${{ secrets.OSX86_READ_TOKEN }}
          path: osx86
          persist-credentials: false

      - name: Install Rust stable and WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Build for wasm32-unknown-unknown
        run: cargo build --target wasm32-unknown-unknown

      - name: Run native tests
        run: cargo test

      - name: Run compiled code differential tests
        run: cargo test --test compiled_code -- --nocapture

      - name: Run ELF loading tests
        run: cargo test --test elf_loading -- --nocapture

      - name: Run system call tests
        run: cargo test --test system_calls -- --nocapture

      - name: Run musl hello world test
        run: cargo test --test musl_hello -- --nocapture

      - name: Clean private checkout
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf osx86

  selected-test:
    if: inputs.test != 'none' && inputs.test != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osx86
    steps:
      - name: Checkout private OSx86
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/x86-64
          token: ${{ secrets.OSX86_READ_TOKEN }}
          path: osx86
          persist-credentials: false

      - name: Install Rust stable and WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate selected test against the private test registry
        env:
          TEST_NAME: ${{ inputs.test }}
        run: |
          if [[ -z "$TEST_NAME" || "$TEST_NAME" == "none" ]]; then
            echo "No test selected; skipping selected-test job."
            exit 1
          fi

          if ! grep -Fqx "  ${TEST_NAME})" .github/run-test.sh; then
            echo "Unknown test: $TEST_NAME"
            echo "The selected value is not a case in .github/run-test.sh."
            exit 1
          fi

          echo "Validated test: $TEST_NAME"

      - name: Run the selected test
        env:
          TEST_NAME: ${{ inputs.test }}
        run: bash .github/run-test.sh "$TEST_NAME"

      # Only the `guest-programs` test writes this folder
      - name: Upload the guest programs
        if: inputs.test == 'guest-programs'
        uses: actions/upload-artifact@v4
        with:
          name: guest-programs
          path: osx86/guest-programs/

      # The renderer checks write their screenshots, and `gtk-app-gaps` and `gtk-app-run` write their reports, to this folder. They are kept even when a check
      # fails, since a picture of the layout is what shows what went wrong.
      - name: Upload the renderer screenshots
        if: always() && (inputs.test == 'gui-renderer-browser' || inputs.test == 'gui-app-browser' || inputs.test == 'gui-app-click-browser' || inputs.test == 'gui-app-font-browser' || inputs.test == 'gui-app-cleanup-browser' || inputs.test == 'gtk-app-gaps' || inputs.test == 'gtk-app-run' || inputs.test == 'galculator-source-fonts')
        uses: actions/upload-artifact@v4
        with:
          name: gui-renderer-screenshots
          path: osx86/test-output/

      - name: Clean private checkout
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf osx86
